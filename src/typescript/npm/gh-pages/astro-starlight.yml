# Astro Starlight Docs workflow — runs on every push to main.
#
# Builds the Astro Starlight documentation site and deploys it to
# GitHub Pages. TypeDoc (listed as a root dev dependency) generates
# API documentation from src/ at build time, so root dependencies
# must be installed alongside the docs/ dependencies.
#
# Expected structure:
#   package.json          — root; must include typedoc as a dev dep
#   src/                  — TypeDoc source input
#   docs/
#     package.json        — Astro Starlight site
#     dist/               — build output (gitignored)
#
# Deployed to: https://@@GITHUB_USER@@.github.io/@@GITHUB_REPO@@
#
# Prerequisites:
#   - GitHub Pages enabled in repository settings, source: "GitHub Actions"
#   - Node.js >= @@NODE_VERSION@@ (default: 22)

name: Publish Astro Starlight Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false  # prevent mid-flight deployment leaving pages in a broken state

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: @@NODE_VERSION@@
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install root dependencies
        run: npm ci
        # TypeDoc runs from root during docs build; root deps must be installed first

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs
        run: npm run build
        working-directory: docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4