# VS Code extension release workflow — triggers on version tag push (v*).
#
# Builds the extension, packages it as a .vsix artefact, attaches it to
# a GitHub release, then publishes to both the VS Code Marketplace and
# the Open VSX Registry.
#
# Required GitHub secrets:
#   VSCE_PAT — Personal Access Token for the VS Code Marketplace (Azure DevOps)
#              Expires every 3 months — rotate before it does.
#   OVSX_PAT — Personal Access Token for the Open VSX Registry
#
# Prerequisites:
#   - Node.js >= @@NODE_VERSION@@ (default: 22)

name: Release VS Code Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: extension
  cancel-in-progress: false  # prevent mid-flight deployment leaving release in a broken state

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: @@NODE_VERSION@@
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx vsce package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          body: |
            See [CHANGELOG.md](https://github.com/@@GITHUB_USER@@/@@GITHUB_REPO@@/blob/main/CHANGELOG.md) for details.

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: "*.vsix"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions: {}  # no GitHub token permissions required; publishes via VSCE_PAT and OVSX_PAT

    steps:
      - name: Download vsix artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix

      - name: Deploy to VS Code Marketplace
        run: npx vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Deploy to Open VSX Registry
        run: npx ovsx publish *.vsix
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_PAT }}